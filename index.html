<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Les petits fripons</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    </head>

    <body>
        <div id="container">
            <div class="header">
                <h2>Tchat</h2>
                <hr>
            </div>

            <div id="main">
                <div id="usersList"></div>
                <div id="tchat"></div>
            </div>

            <div id="typingText"></div>
        </div>

        <div class="footer">
            <input type="color" id="colorPicker" placeholder="">
            <input id="pseudo" placeholder="Pseudo">
            
            <div class="inputWrapper">
                <input id="msg" placeholder="Message" autofocus>
                <button id="emotesBtn">😊</button>
            </div>

            <button onclick="send()">Envoyer</button>
        </div>

        <div id="emotesPicker" class="hidden">
            <button class="emotes">😊</button>
            <button class="emotes">😄</button>
            <button class="emotes">☹️</button>
            <button class="emotes">❤️</button>
            <button class="emotes">😉</button>
        </div>

        <script src="main.js"></script>
    </body>
</html>
